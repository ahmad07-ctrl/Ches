<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu d'Échecs - Thème Bleu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
            }
        }
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 55px);
            grid-template-rows: repeat(8, 55px);
            border: 4px solid #1f2937;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .square {
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            cursor: pointer;
            user-select: none;
        }
        .square.light {
            background-color: #dee3e6;
        }
        .square.dark {
            background-color: #4b7399;
        }
        .sidebar {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 180px;
            align-items: center;
        }
        #status {
            font-size: 16px;
            font-weight: bold;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="chessboard" id="chessboard"></div>
        <div class="sidebar">
            <div id="status">Tour des Blancs</div>
            <button id="restart-btn">Nouvelle Partie</button>
        </div>
    </div>

    <script>
        const chessboard = document.getElementById('chessboard');
        const statusDisplay = document.getElementById('status');
        const restartBtn = document.getElementById('restart-btn');

        // Configuration initiale de l'échiquier (P = Pions, R = Tours, N = Cavaliers, B = Fous, Q = Dame, K = Roi)
        // Les majuscules = Blancs, les minuscules = Noirs
        const initialBoard = [
            ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
            ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['', '', '', '', '', '', '', ''],
            ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
            ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
        ];

        // Correspondance des symboles d'échecs Unicode
        const pieces = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
        };

        function renderBoard(board) {
            chessboard.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    
                    if ((row + col) % 2 === 0) {
                        square.classList.add('light');
                    } else {
                        square.classList.add('dark');
                    }

                    const pieceCode = board[row][col];
                    if (pieceCode) {
                        square.textContent = pieces[pieceCode];
                        // Couleur du texte pour différencier blancs et noirs si besoin
                        if (pieceCode === pieceCode.toUpperCase()) {
                            square.style.color = '#ffffff'; // Pièces blanches bien visibles
                            // Ajout d'une légère ombre pour détacher les pièces blanches du fond clair
                            square.style.textShadow = '0 1px 2px rgba(0,0,0,0.8)';
                        } else {
                            square.style.color = '#000000'; // Pièces noires
                        }
                    }

                    chessboard.appendChild(square);
                }
            }
        }

        // Lancer une nouvelle partie
        restartBtn.addEventListener('click', () => {
            renderBoard(initialBoard);
            statusDisplay.textContent = "Tour des Blancs";
        });

        // Affichage initial au chargement de la page
        renderBoard(initialBoard);
    </script>
</body>
</html>
