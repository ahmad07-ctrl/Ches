<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu d'Échecs - Thème Bleu</title>
    <!-- Importation de chess.js pour gérer toutes les règles des échecs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
            }
        }
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 55px);
            grid-template-rows: repeat(8, 55px);
            border: 4px solid #1f2937;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .square {
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            cursor: pointer;
            user-select: none;
        }
        .square.light {
            background-color: #dee3e6;
        }
        .square.dark {
            background-color: #4b7399;
        }
        .square.selected {
            background-color: #7bacc7 !important; /* Couleur de sélection style Chess.com */
        }
        .square.highlight {
            background-color: #a4c2f4 !important;
        }
        .sidebar {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 180px;
            align-items: center;
        }
        #status {
            font-size: 16px;
            font-weight: bold;
            text-align: center;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="chessboard" id="chessboard"></div>
        <div class="sidebar">
            <div id="status">Tour des Blancs</div>
            <button id="restart-btn">Nouvelle Partie</button>
        </div>
    </div>

    <script>
        const game = new Chess();
        const chessboardEl = document.getElementById('chessboard');
        const statusEl = document.getElementById('status');
        const restartBtn = document.getElementById('restart-btn');

        let selectedSquare = null;
        let possibleMoves = [];

        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        function renderBoard() {
            chessboardEl.innerHTML = '';
            const board = game.board();

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const squareEl = document.createElement('div');
                    squareEl.classList.add('square');
                    
                    if ((row + col) % 2 === 0) {
                        squareEl.classList.add('light');
                    } else {
                        squareEl.classList.add('dark');
                    }

                    const squareCoords = String.fromCharCode(97 + col) + (8 - row);

                    // Gestion de la sélection et des coups possibles
                    if (selectedSquare === squareCoords) {
                        squareEl.classList.add('selected');
                    }
                    if (possibleMoves.includes(squareCoords)) {
                        squareEl.classList.add('highlight');
                    }

                    const piece = board[row][col];
                    if (piece) {
                        squareEl.textContent = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type.toLowerCase() ];
                        if (piece.color === 'w') {
                            squareEl.style.color = '#ffffff';
                            squareEl.style.textShadow = '0 1px 2px rgba(0,0,0,0.8)';
                        } else {
                            squareEl.style.color = '#000000';
                        }
                    }

                    squareEl.addEventListener('click', () => handleSquareClick(squareCoords));
                    chessboardEl.appendChild(squareEl);
                }
            }
            updateStatus();
        }

        function handleSquareClick(square) {
            if (selectedSquare === null) {
                // Sélectionner une pièce si c'est la bonne couleur
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    possibleMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
                    renderBoard();
                }
            } else {
                // Tenter de déplacer la pièce
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q' // Promotion automatique en Dame par simplicité
                });

                selectedSquare = null;
                possibleMoves = [];

                if (move === null) {
                    // Si le coup est invalide, vérifier si on clique sur une autre pièce à soi
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        possibleMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
                    }
                }
                renderBoard();
            }
        }

        function updateStatus() {
            if (game.in_checkmate()) {
                statusEl.textContent = "Échec et mat ! Fin de partie.";
            } else if (game.in_draw()) {
                statusEl.textContent = "Match nul !";
            } else {
                let turn = game.turn() === 'w' ? "Blancs" : "Noirs";
                statusEl.textContent = `Tour des ${turn}`;
                if (game.in_check()) {
                    statusEl.textContent += " (ÉCHEC !)";
                }
            }
        }

        restartBtn.addEventListener('click', () => {
            game.reset();
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
        });

        // Premier affichage
        renderBoard();
    </script>
</body>
</html>
